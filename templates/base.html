<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TimeLearn{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="logo">⏱ TimeLearn</div>
        <nav>
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('lessons') }}">Уроки</a>
            <a href="{{ url_for('kanban') }}">Канбан</a>
            <a href="{{ url_for('timer') }}">Таймер</a>
            <a href="{{ url_for('about') }}">О проекте</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2025 TimeLearn — учись программировать и управляй временем</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
